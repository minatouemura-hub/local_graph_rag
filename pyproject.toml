[project]
name = "local-graphrag"
version = "0.1.0"
description = "Fully local, layout-aware OCR GraphRAG for Apple Silicon edge devices"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "pymupdf>=1.24,<2",
  "pillow>=10,<12",
  "pyyaml>=6,<7",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
embedding = [
  "sentence-transformers>=3,<6",
]
graph = [
  "ladybug>=0.1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
